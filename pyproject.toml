[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videohaul"
version = "0.1.0"
description = "Open-source desktop and browser media downloader with truthful progress reporting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Anas Al Hwaity" }]
keywords = ["video", "downloader", "media", "yt-dlp", "hls", "dash"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
requires-python = ">=3.10,<3.15"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn>=0.35,<1",
  "pywebview>=6,<7",
  "streamlink>=7,<8",
  "playwright>=1.55,<2",
]

[project.scripts]
videohaul = "videohaul.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
videohaul = ["web/static/*"]
